[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-do"
version = "0.1.0"
description = "Give Claude a file, and it does what the file says."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

[project.scripts]
claude-do = "claude_do:main"

[tool.setuptools]
packages = ["claude_do"]
